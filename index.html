<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
    integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
    crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
  <body>
    <div class="p-5" style="background-color: #2c3e50"><h1>Quản lý Danh Mục Sách</h1></div>
    <div style="display: flex;justify-content: center;">
      <div class="container p-3 m-5">
        <form onsubmit="addBook(event)" class="row" id="bookForm">
          <label class="col-2">Tên sách:</label>
          <div class="col-10 mb-5">
            <input type="text" name="name" style="height: 40px" class="col rounded -1" />
            <div class="text-danger" id="errorName"></div>
          </div>
          <label class="col-2">Tác giả:</label>
          <div class="col-10 mb-5">
            <input type="text" name="author" class="col rounded -1" style="height: 40px" />
            <div class="text-danger" id="errorAuthor"></div>
          </div>
          <label class="col-2">Năm xuất bản:</label>
          <div class="col-10 mb-5">
            <input type="text" name="publication" class="col rounded -1" style="height: 40px" />
            <div class="text-danger" id="errorPublication"></div>
          </div>
          <label class="col-2">Thế loại:</label>
          <div class="col-10 mb-5">
            <input type="text" name="category" class="col rounded -1" style="height: 40px" />
            <div class="text-danger" id="errorCategory"></div>
          </div>
          <button class="btn btn-primary col-12 mb-4" style="box-sizing: border-box">Thêm sách:</button>
        </form>
        <input
          type="text"
          id="searchInput"
          placeholder="Tìm kiếm theo tên sách..."
          class="col-12 p-1 rounded border mb-4" />
        <table class="table table-bordered">
          <thead>
            <tr>
              <th>Tên sách</th>
              <th>Tác giả</th>
              <th>Năm</th>
              <th>Thể loại</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"></script>
    <script src="./main.js"></script>
  </body>
</html>
